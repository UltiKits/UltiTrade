name: Maven CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: Test, coverage gate & package (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # JDK 17 was dropped here: paper-api 1.21.11's class files are bytecode version 65
        # (Java 21). A JDK 17 javac cannot even read them ("bad class file ... wrong version
        # 65.0, should be 61.0"), so that leg failed at compilation, not at the tests this
        # migration expects to be red. Bytecode output stays Java 8 (pom's <source>/<target>);
        # only the toolchain needs to be 21, matching the framework's own build (see root
        # UltiTools-Reborn CLAUDE.md, "Java 8 bytecode, JDK 21 toolchain").
        java-version: ['21']
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven
      - name: Verify
        # verify runs test, then jacoco:check, then package -- one command replaces the shared
        # workflow's separate test and package steps, and is the only phase at which the gate runs.
        run: mvn -B verify
